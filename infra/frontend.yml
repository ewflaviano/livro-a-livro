AWSTemplateFormatVersion: '2010-09-09'
Description: Livro a Livro static PWA. This stack contains no user library data.
Parameters:
  CertificateArn: { Type: String }
  HostedZoneId: { Type: String }
  RedirectHostedZoneId: { Type: String }
  DomainName: { Type: String, Default: livroalivro.app.br }
Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        Description: Read only Livro a Livro public build assets.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self'; img-src 'self' blob: https://covers.openlibrary.org https://archive.org https://*.us.archive.org https://www.googletagmanager.com https://www.google-analytics.com https://region1.google-analytics.com; connect-src 'self' https://openlibrary.org https://covers.openlibrary.org https://api.livroalivro.app.br https://www.googleapis.com https://www.googletagmanager.com https://www.google-analytics.com https://region1.google-analytics.com; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
            Override: true
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: no-referrer, Override: true }
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Override: true
          XSSProtection: { ModeBlock: true, Protection: true, Override: true }
  CanonicalRedirect:
    Type: AWS::CloudFront::Function
    Properties:
      Name: livro-a-livro-canonical-redirect
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect alternate site domains to the canonical HTTPS domain.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host.value.toLowerCase();
          if (host === 'livroalivro.app.br') return request;
          if (host !== 'www.livroalivro.app.br' &&
              host !== 'livroalivro.com.br' &&
              host !== 'www.livroalivro.com.br') return request;
          var location = 'https://livroalivro.app.br' + request.uri;
          var query = request.querystring;
          var pairs = [];
          // CloudFront groups repeated parameter names; their original interleaving is unavailable.
          for (var name in query) {
            if (!Object.prototype.hasOwnProperty.call(query, name)) continue;
            var values = query[name].multiValue || [query[name]];
            for (var i = 0; i < values.length; i++) {
              pairs.push(encodeURIComponent(name) + '=' + encodeURIComponent(values[i].value || ''));
            }
          }
          if (pairs.length) location += '?' + pairs.join('&');
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: {
              location: { value: location },
              'cache-control': { value: 'public,max-age=300' }
            }
          };
        }
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases: [!Ref DomainName, !Sub 'www.${DomainName}', livroalivro.com.br, www.livroalivro.com.br]
        DefaultRootObject: index.html
        Origins:
          - Id: application
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: application
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt CanonicalRedirect.FunctionMetadata.FunctionARN
          Compress: true
        CacheBehaviors:
          - PathPattern: /assets/*
            TargetOriginId: application
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: !Ref SecurityHeaders
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt CanonicalRedirect.FunctionMetadata.FunctionARN
            Compress: true
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'
  SiteAlias:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget: { DNSName: !GetAtt FrontendDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  SiteAliasIpv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt FrontendDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  WwwSiteAlias:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: www.livroalivro.app.br
      Type: A
      AliasTarget: { DNSName: !GetAtt FrontendDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  WwwSiteAliasIpv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: www.livroalivro.app.br
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt FrontendDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  RedirectApexAlias:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref RedirectHostedZoneId
      Name: livroalivro.com.br
      Type: A
      AliasTarget: { DNSName: !GetAtt FrontendDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  RedirectApexAliasIpv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref RedirectHostedZoneId
      Name: livroalivro.com.br
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt FrontendDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  RedirectWwwAlias:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref RedirectHostedZoneId
      Name: www.livroalivro.com.br
      Type: A
      AliasTarget: { DNSName: !GetAtt FrontendDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
  RedirectWwwAliasIpv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref RedirectHostedZoneId
      Name: www.livroalivro.com.br
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt FrontendDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false }
Outputs:
  FrontendBucketName: { Value: !Ref FrontendBucket, Export: { Name: !Sub '${AWS::StackName}-FrontendBucketName' } }
  FrontendDistributionId: { Value: !Ref FrontendDistribution, Export: { Name: !Sub '${AWS::StackName}-FrontendDistributionId' } }
  SiteUrl: { Value: !Sub 'https://${DomainName}' }
