AWSTemplateFormatVersion: '2010-09-09'
Description: Least-privilege GitHub Actions publishing role for Livro a Livro frontend.
Parameters:
  FrontendStackName: { Type: String, Default: livro-a-livro-frontend }
Resources:
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: livro-a-livro-github-deploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com' }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # This repository uses GitHub's immutable OIDC subject template.
              # Keep the stable owner/repository IDs and restrict credentials
              # to releases from main.
              StringLike:
                token.actions.githubusercontent.com:sub: repo:ewflaviano@324998515/livro-a-livro@1389905851:ref:refs/heads/main
      Policies:
        - PolicyName: publish-static-release
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub 'arn:aws:cloudformation:us-east-1:${AWS::AccountId}:stack/${FrontendStackName}/*'
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !Sub
                  - 'arn:aws:s3:::${Bucket}'
                  - Bucket: { Fn::ImportValue: !Sub '${FrontendStackName}-FrontendBucketName' }
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub
                  - 'arn:aws:s3:::${Bucket}/*'
                  - Bucket: { Fn::ImportValue: !Sub '${FrontendStackName}-FrontendBucketName' }
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub
                  - 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
                  - Distribution: { Fn::ImportValue: !Sub '${FrontendStackName}-FrontendDistributionId' }
Outputs:
  DeployRoleArn: { Value: !GetAtt DeployRole.Arn }
